services:

  mysql:
    image: mysql:8.4
    container_name: colorboard-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: colorboard
      MYSQL_USER: colorboard
      MYSQL_PASSWORD: colorboard123
      MYSQL_ROOT_PASSWORD: root123

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - colorboard

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot123"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    image: kiranlintech/colorboard:${COLORBOARD_TAG}
    container_name: colorboard-backend
    restart: unless-stopped

    environment:
      DB_URL: jdbc:mysql://mysql:3306/colorboard
      DB_USER: colorboard
      DB_PASSWORD: colorboard123

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - colorboard


  nginx:
    image: kiranlintech/colorboard-nginx:${COLORBOARD_TAG}
    container_name: colorboard-nginx
    restart: unless-stopped

    ports:
      - "8087:80"

    depends_on:
      - backend

    networks:
      - colorboard


volumes:
  mysql_data:


networks:
  colorboard:
    driver: bridge
